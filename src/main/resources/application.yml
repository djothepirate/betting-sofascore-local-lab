spring:
  application:
    name: sofascore-local-lab
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:sofascore_local_lab}
    username: ${POSTGRES_USER:sofascore_lab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  cache:
    type: caffeine
    cache-names:
      - endpointCatalog
      - providerResponses
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m
  thymeleaf:
    cache: true

server:
  address: 127.0.0.1
  port: 8087
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: SofaScore Local Lab
    version: 0.1.0-SNAPSHOT
    phase: J3-DYNAMIC-CACHE-POLICY
    status: EXPERIMENTAL_LOCAL_ONLY

sofascore:
  enabled: ${SOFASCORE_ENABLED:false}
  j3-qualification-enabled: ${SOFASCORE_J3_QUALIFICATION_ENABLED:false}
  base-url: ${SOFASCORE_BASE_URL:}
  maximum-concurrency: 1
  minimum-delay: 3s
  connect-timeout: 5s
  read-timeout: 10s
  automatic-refresh-enabled: false
  live-polling-enabled: false
  store-raw-payloads: true
  raw-payload-retention-days: 30
  export-directory: ${SOFASCORE_EXPORT_DIR:./exports}
  allowed-endpoints: ${SOFASCORE_ALLOWED_ENDPOINTS:}

logging:
  level:
    root: INFO
    com.bettingproject.sofascorelocal: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
