include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - validate
  - test
  - observe
  - package

variables:
  GIT_DEPTH: "0"
  AST_ENABLE_MR_PIPELINES: "true"
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dfile.encoding=UTF-8
    -Duser.timezone=UTC
    -Djava.awt.headless=true
  SOFASCORE_ENABLED: "false"
  SOFASCORE_PLAYWRIGHT_ENABLED: "false"
  SOFASCORE_J3_QUALIFICATION_ENABLED: "false"
  SOFASCORE_J4_EVENT_DETAILS_QUALIFICATION_ENABLED: "false"
  SOFASCORE_J4_EVENT_DETAILS_PHASE2_ENABLED: "false"
  SOFASCORE_J5_EVENT_DATA_QUALIFICATION_ENABLED: "false"
  SOFASCORE_TOURNAMENT_EVENT_DISCOVERY_ENABLED: "false"
  OPTIONAL_INTEGRATION_ENABLED: "false"
  OPTIONAL_INTEGRATION_EXECUTION_MODE: "DISABLED"
  OPTIONAL_INTEGRATION_REMOTE_DELIVERY_AUTHORIZED: "false"
  OPTIONAL_INTEGRATION_OFFICIAL_PERMISSION_STATUS: "NOT_EVIDENCED"
  OPTIONAL_INTEGRATION_RECEIVER_QUALIFICATION: "NOT_QUALIFIED"
  OPTIONAL_INTEGRATION_SENDER_QUALIFICATION: "NOT_QUALIFIED"
  OPTIONAL_INTEGRATION_RECEIVER_ORIGIN: ""
  OPTIONAL_INTEGRATION_LOOPBACK_QUALIFICATION: "false"
  OPTIONAL_INTEGRATION_LOOPBACK_ORIGIN: ""
  OPTIONAL_INTEGRATION_AUTOMATIC_RETRY_ENABLED: "false"
  OPTIONAL_INTEGRATION_MTLS_CLIENT_CERTIFICATE_SHA256: ""
  SECRET_DETECTION_HISTORIC_SCAN: "true"
  # Canaris synthétiques audités ; le scanner strict ne les exempte que pour le blob SHA connu.
  SECRET_DETECTION_EXCLUDED_PATHS: "scripts/Invoke-J5PlaywrightLoopbackQualification.ps1"
  SAST_EXCLUDED_ANALYZERS: "spotbugs"

default:
  interruptible: true

secret_detection:
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$SECRET_DETECTION_DISABLED == "true" || $SECRET_DETECTION_DISABLED == "1"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$AST_ENABLE_MR_PIPELINES == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$AST_ENABLE_MR_PIPELINES == "true" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.maven-java25:
  image:
    name: "docker.io/library/maven@sha256:7e461cec477077c1d9e50b13df8aef9018764410f4c4cd7c34803f10c4c99e4c"
  before_script:
    - chmod +x mvnw ci/*.sh
    - java --version
    - ./mvnw -version

validate:local-only:
  extends: .maven-java25
  stage: validate
  script:
    - sh ci/assert-local-only.sh
    - |
      secret_scan_base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      sh ci/check-no-secrets.sh "$secret_scan_base"
    - sh ci/check-gitlab-pipeline-ref.sh
    - sh ci/test-package-guards.sh
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        if ! printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
          echo "FAIL: tag hors convention SemVer : $CI_COMMIT_TAG" >&2
          exit 1
        fi
        if [ "${CI_COMMIT_REF_PROTECTED:-false}" != true ]; then
          echo "FAIL: le tag $CI_COMMIT_TAG doit correspondre à la règle de tags protégés v*." >&2
          exit 1
        fi
        printf 'TAG_REF=%s\n' "$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ]; then
        source_branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
        target_branch=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        sh ci/check-branch-name.sh "$source_branch"
        sh ci/check-branch-name.sh "$target_branch"
        source_ref="refs/remotes/origin/$source_branch"
        target_ref="refs/remotes/origin/$target_branch"
        git fetch --force --no-tags origin \
          "+refs/heads/main:refs/remotes/origin/main" \
          "+refs/heads/$source_branch:$source_ref" \
          "+refs/heads/$target_branch:$target_ref" \
          "+refs/tags/*:refs/tags/*"
        source_sha=${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}
        project_version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
        sh ci/check-gitlab-merge-request.sh "$project_version" "$source_sha"
      fi
    - |
      diff_base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      if [ -n "$diff_base" ] \
        && ! printf '%s' "$diff_base" | grep -Eq '^0+$' \
        && git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
        git diff --check "${diff_base}...HEAD"
      else
        git show --check --format= HEAD
      fi

test:linux:
  extends: .maven-java25
  stage: test
  services:
    - name: "docker.io/library/docker@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07"
      alias: docker
      command:
        - --tls=false
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  timeout: 60m
  script:
    - source_epoch=$(git show -s --format=%ct "$CI_COMMIT_SHA")
    - ./mvnw -B -ntp -Dproject.build.outputTimestamp="$source_epoch"
      -Pintegration-tests clean verify
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/

quality:observe:
  extends: .maven-java25
  stage: observe
  allow_failure: true
  timeout: 45m
  script:
    - |
      status=0
      ./mvnw -B -ntp \
        -Djacoco.propertyName=jacoco.agent.argLine \
        org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent \
        test \
        org.jacoco:jacoco-maven-plugin:0.8.15:report || status=$?
      if [ ! -s target/jacoco.exec ]; then
        echo 'FAIL: les données d’exécution JaCoCo sont absentes ou vides.' >&2
        status=1
      fi
      if [ ! -s target/site/jacoco/jacoco.xml ]; then
        echo 'FAIL: le rapport XML JaCoCo est absent ou vide.' >&2
        status=1
      fi
      ./mvnw -B -ntp -DskipTests \
        org.apache.maven.plugins:maven-pmd-plugin:3.28.0:pmd \
        org.apache.maven.plugins:maven-pmd-plugin:3.28.0:cpd || status=$?
      ./mvnw -B -ntp -DskipTests \
        org.apache.maven.plugins:maven-javadoc-plugin:3.12.0:javadoc || status=$?
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/site/jacoco/
      - target/site/apidocs/
      - target/pmd.xml
      - target/cpd.xml

security:dependencies:
  extends: .maven-java25
  stage: observe
  allow_failure: true
  timeout: 30m
  cache: []
  script:
    - sh ci/run-dependency-check.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/dependency-check-report.*
      - target/dependency-check-gitlab.json

.package-local-only:
  extends: .maven-java25
  stage: package
  dependencies: []
  script:
    - source_epoch=$(git show -s --format=%ct "$CI_COMMIT_SHA")
    - ./mvnw -B -ntp -DskipTests
      -Dproject.build.outputTimestamp="$source_epoch" clean package
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        tag_version=${CI_COMMIT_TAG#v}
        case "$tag_version" in
          *-rc.*)
            release_core=${tag_version%-rc.*}
            release_rc=${tag_version##*-rc.}
            case "$release_rc" in
              [1-9]) release_rc="0$release_rc" ;;
              ??) ;;
              *)
                echo "FAIL: le tag $CI_COMMIT_TAG ne possède aucun train release canonique (rc.1 à rc.99 uniquement)." >&2
                exit 1
                ;;
            esac
            branch_train="V${release_core}-RC${release_rc}"
            ;;
          *)
            branch_train="V${tag_version}"
            ;;
        esac
        feature_branch="feature/$branch_train"
        release_branch="release/$branch_train"
        feature_ref="refs/remotes/origin/$feature_branch"
        release_ref="refs/remotes/origin/$release_branch"
        git fetch --no-tags origin \
          "+refs/heads/main:refs/remotes/origin/main" \
          "+refs/heads/$feature_branch:$feature_ref" \
          "+refs/heads/$release_branch:$release_ref"
        PROMOTION_TAG_PROOF=true \
          FEATURE_BRANCH_REF="$feature_ref" \
          RELEASE_BRANCH_REF="$release_ref" \
          sh ci/package-local-only.sh
      else
        git fetch --no-tags origin \
          "+refs/heads/main:refs/remotes/origin/main"
        sh ci/package-local-only.sh
      fi
  artifacts:
    paths:
      - target/distribution/

package:snapshot-local-only:
  extends: .package-local-only
  variables:
    DURABLE_SNAPSHOT_SOURCE: "true"
  artifacts:
    name: "sofascore-local-only-snapshot-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - target/distribution/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/V(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-RC(0[1-9]|[1-9][0-9])(-SNAPSHOT)?)?$/'

package:release-local-only:
  extends: .package-local-only
  artifacts:
    name: "sofascore-local-only-${CI_COMMIT_TAG}"
    expire_in: never
    paths:
      - target/distribution/
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/'
