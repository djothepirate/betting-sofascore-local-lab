name: CI

"on":
  # Une qualification bloquante par PR ; le lancement manuel permet une reprise
  # explicite. Aucun push ni tag ne produit de bundle intermédiaire automatique.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  SOFASCORE_ENABLED: "false"
  SOFASCORE_PLAYWRIGHT_ENABLED: "false"
  SOFASCORE_J3_QUALIFICATION_ENABLED: "false"
  SOFASCORE_J4_EVENT_DETAILS_QUALIFICATION_ENABLED: "false"
  SOFASCORE_J4_EVENT_DETAILS_PHASE2_ENABLED: "false"
  SOFASCORE_J5_EVENT_DATA_QUALIFICATION_ENABLED: "false"
  SOFASCORE_TOURNAMENT_EVENT_DISCOVERY_ENABLED: "false"
  OPTIONAL_INTEGRATION_ENABLED: "false"
  OPTIONAL_INTEGRATION_EXECUTION_MODE: "DISABLED"
  OPTIONAL_INTEGRATION_REMOTE_DELIVERY_AUTHORIZED: "false"
  OPTIONAL_INTEGRATION_OFFICIAL_PERMISSION_STATUS: "NOT_EVIDENCED"
  OPTIONAL_INTEGRATION_RECEIVER_QUALIFICATION: "NOT_QUALIFIED"
  OPTIONAL_INTEGRATION_SENDER_QUALIFICATION: "NOT_QUALIFIED"
  OPTIONAL_INTEGRATION_RECEIVER_ORIGIN: ""
  OPTIONAL_INTEGRATION_LOOPBACK_QUALIFICATION: "false"
  OPTIONAL_INTEGRATION_LOOPBACK_ORIGIN: ""
  OPTIONAL_INTEGRATION_AUTOMATIC_RETRY_ENABLED: "false"
  OPTIONAL_INTEGRATION_MTLS_CLIENT_CERTIFICATE_SHA256: ""

jobs:
  windows:
    name: Windows — garde locale et tests standards
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Vérifier le Maven Wrapper
        shell: powershell
        run: .\mvnw.cmd -version

      - name: Vérifier les garde-fous locaux et les tests
        shell: powershell
        env:
          # Le temp JUnit Windows doit être canonique : les alias 8.3 feraient
          # échouer la garde anti-lien de LocalJ7ExportFileStore avant le test.
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\Verify-Local.ps1

      - name: Vérifier le lanceur du bundle extrait
        shell: pwsh
        run: ./ci/test-distribution-launchers.ps1

      - name: Vérifier la résolution du worker hors ligne
        shell: pwsh
        run: ./scripts/wo056/Test-WO056WorkerArtifact.ps1

      - name: Vérifier le commit
        shell: powershell
        run: git show --check --format= HEAD

      - name: Vérifier les preuves XML obligatoires des tests standards
        if: ${{ always() }}
        shell: powershell
        run: java ci/VerifyTestReports.java standard

      - name: Conserver les preuves XML obligatoires Windows
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: target/surefire-reports/TEST-*.xml

  linux:
    name: Linux — sécurité, PostgreSQL et distribution locale
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      SOURCE_COMMIT_SHA: ${{ github.sha }}
      SOURCE_BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || (github.ref_type == 'branch' && github.ref_name || '') }}
    steps:
      - name: Extraire le dépôt avec son historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Vérifier les politiques CI locales
        run: |
          chmod +x mvnw ci/*.sh
          sh ci/assert-local-only.sh
          sh ci/check-no-secrets.sh "$SECRET_SCAN_BASE"

      - name: Vérifier la topologie de la Pull Request GitHub
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          project_version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          sh ci/check-github-pull-request.sh \
            "$SOURCE_BRANCH" "$TARGET_BRANCH" "$BASE_SHA" "$HEAD_SHA" "$project_version"

      - name: Vérifier la branche et la version Maven du lancement manuel
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != branch ]; then
            echo 'FAIL: la qualification manuelle GitHub exige une branche.' >&2
            exit 1
          fi
          project_version=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          sh ci/check-branch-version.sh "$BRANCH_NAME" "$project_version"

      - name: Tester les garde-fous de provenance et de release locale
        run: |
          sh ci/test-package-guards.sh
          sh ci/test-branch-version.sh
          java ci/TestVerifyTestReports.java

      - name: Exécuter les tests standards et PostgreSQL/Testcontainers
        run: |
          source_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT_SHA")
          ./mvnw -B -ntp -Dproject.build.outputTimestamp="$source_epoch" \
            -Pintegration-tests clean verify

      - name: Vérifier le diff
        run: |
          if [ -n "$SECRET_SCAN_BASE" ] \
            && ! printf '%s' "$SECRET_SCAN_BASE" | grep -Eq '^0+$' \
            && git cat-file -e "${SECRET_SCAN_BASE}^{commit}" 2>/dev/null; then
            git diff --check "${SECRET_SCAN_BASE}...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Vérifier les preuves XML obligatoires des tests standards et PostgreSQL
        if: ${{ always() }}
        run: java ci/VerifyTestReports.java integration

      - name: Conserver les preuves XML obligatoires Linux
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-linux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
            target/failsafe-reports/failsafe-summary.xml
